<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hide Odd Rows</title>
</head>
<style>
    table{
        margin-top: 5px;
        margin-left: 18px;
        width: 80px;
        height: 60px;
    }
    td{
        text-align: center;
    }
</style>
<body>
    <h2>Hide Odd Rows</h2>
    <table border="1"> 
        <tr>
            <td>Row 1</td>
        </tr> 
        <tr>
            <td>Row 2</td>
        </tr> 
        <tr>
            <td>Row 3</td>
        </tr> 
        <tr>
            <td>Row 4</td>
        </tr> 
        <tr>
            <td>Row 5</td>
        </tr> 
    </table>

    <script>
        var rows = document.querySelectorAll("table tr");
        for (var i = 0; i < rows.length; i++) 
        { 
            if (i % 2 === 0) 
            {  
              rows[i].style.display = "none"; 
            } 
        }
    </script>
</body>
</html>
