<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Message</title>
</head>
<style>
    button{
      padding: 6px;
      margin-left: 10px;
      border: 1px solid ;
      background-color: rgb(1, 73, 241);
      border-radius: 4px;
      width: 65px;
      height: 35px;
      color: white;
    }
</style>
<body>
    <h2>Click to Log a Message</h2>
    <button id="myButton">Click Me</button>
    <script> 
     var button = document.getElementById("myButton"); 
       button.addEventListener("click", 
       function() 
       { 
        console.log("Hello, Good Morning!"); 
        alert("Hello, Good Morning!"); 
       }); 
    </script>
</body>
</html>
