<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
</head>
<style>
    body {  
        margin: 40px;
    } 
    label{
        font-weight: bold;
    }
    input 
    { 
        margin: 5px; 
        padding: 5px; 
    } 
    button { 
        margin: 12px; 
        padding: 6px 10px;  
        background-color: rgb(1, 73, 241);
        color: white;
        border: 1px solid;  
        border-radius: 4px;
        height: 35px;
    } 
    #Answer { 
        margin-top: 15px; 
        font-weight: bold
    }
</style>
<body>
    <h1>Multiplication & Division Calculator</h1>
    <label>Enter 1st Number : </label>
    <input type="number" id="num1"><br>
    <label>Enter 2nd Number : </label>
    <input type="number" id="num2"><br>
    <button onclick="multiply()">Multiply</button>
    <button onclick="divide()">Divide</button>

    <div id="Answer"></div>

    <script> 
       function multiply() 
       { 
        let a = parseFloat(document.getElementById("num1").value); 
        let b = parseFloat(document.getElementById("num2").value); 
        let product = a * b; document.getElementById("Answer").innerHTML = "The Result is : " + product;
       } 
        
        function divide() 
        { 
            let a = parseFloat(document.getElementById("num1").value); 
            let b = parseFloat(document.getElementById("num2").value); 
            if (b === 0) 
            { 
                document.getElementById("Answer").innerHTML = "Error: Division by zero is not allowed!"; 
            } 
            else 
            { 
                let quotient = a / b; 
                document.getElementById("Answer").innerHTML = "The Result is : " + quotient; 
            }
        } 
    </script>
</body>
</html>
